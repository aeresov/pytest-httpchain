name: Deploy Documentation

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

# Deploy-only permissions (pages/id-token write) are granted on the deploy job,
# not at workflow level — PR-triggered build runs get read-only access.
permissions:
    contents: read

# Per ref, as in test.yml: a PR update cancels its superseded build, and PR
# builds no longer queue behind each other or behind a deploy. A push run in
# progress is never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.9"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install 3.13

            - name: Install dependencies
              run: uv sync --locked --group docs

            - name: Generate JSON Schema
              run: uv run python scripts/generate_schema.py

            # --strict: a warning, such as a link to a missing page or anchor,
            # fails the build, a PR's included.
            - name: Build documentation
              run: uv run mkdocs build --strict

            - name: Disable Jekyll
              run: touch ./site/.nojekyll

            - name: Upload artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: ./site

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Only this job touches Pages: deploys run one at a time and one in
        # flight is never cancelled.
        concurrency:
            group: "pages"
            cancel-in-progress: false
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        # A hang guard with room for deploy-pages' own wait on the deployment.
        timeout-minutes: 15
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
