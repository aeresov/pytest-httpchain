name: Publish to PyPI

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    test:
        name: Test
        # test.yml's test job requests id-token: write (Codecov OIDC upload); a
        # called workflow can never exceed its caller's grant, so without this
        # the release gate fails at plan time and blocks every release.
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/test.yml

    # Canonical PyPA split: build in an unprivileged job, hand the dists to a
    # publish job that holds only the trusted-publishing OIDC grant — checkout
    # and build backends never run with the credential.
    build:
        name: Build distribution
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install 3.13

            - name: Check release tag matches project version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  version="$(uv version --short)"
                  if [ "$TAG" != "v${version}" ]; then
                      echo "Release tag '$TAG' does not match project version 'v${version}' from pyproject.toml" >&2
                      exit 1
                  fi

            - name: Build distribution
              run: |
                  uv build
                  echo "Built packages:"
                  ls -la dist/

            - name: Upload distribution artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/

    publish:
        name: Publish to PyPI
        runs-on: ubuntu-latest
        needs: build
        environment: pypi
        permissions:
            id-token: write # IMPORTANT: mandatory for trusted publishing

        steps:
            - name: Download distribution artifact
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - name: Publish distribution to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
