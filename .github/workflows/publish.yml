name: Publish to PyPI

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    test:
        name: Test
        # test.yml's coverage job requests id-token: write (Codecov OIDC
        # upload). A release run skips it, but a called workflow's job can
        # never request more than its caller grants, which is checked at plan
        # time whatever the job's `if`: without this the release gate fails
        # at plan time and blocks every release.
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/test.yml

    # Canonical PyPA split: build in an unprivileged job, hand the dists to a
    # publish job that holds only the trusted-publishing OIDC grant — checkout
    # and build backends never run with the credential.
    build:
        name: Build distribution
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: test
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # No cache in the release build: it would restore what other runs
            # saved, among them main-branch runs that execute every dev
            # dependency and pytest from git. `uv build` starts cold instead.
            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.9"
                  enable-cache: false

            - name: Set up Python
              run: uv python install 3.13

            - name: Check release tag matches project version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  version="$(uv version --short)"
                  if [ "$TAG" != "v${version}" ]; then
                      echo "Release tag '$TAG' does not match project version 'v${version}' from pyproject.toml" >&2
                      exit 1
                  fi

            - name: Build distribution
              run: |
                  uv build
                  echo "Built packages:"
                  ls -la dist/

            - name: Upload distribution artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/

    publish:
        name: Publish to PyPI
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: build
        environment: pypi
        permissions:
            id-token: write # IMPORTANT: mandatory for trusted publishing

        steps:
            - name: Download distribution artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: dist/

            - name: Publish distribution to PyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
