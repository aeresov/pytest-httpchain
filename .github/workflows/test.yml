name: Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    # Allows publish.yml to run the full lint+test suite as a release gate.
    workflow_call:

permissions:
    contents: read

# Cancel superseded runs on PR updates; never cancel a push run or the
# release-gate invocation (workflow_call from publish.yml).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # The Makefile's `lint` target runs these gates in this order (with
    # `uv lock --check` for `uv sync --locked`): change the two together.
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  # uv itself is pinned, as uv's GitHub Actions guide recommends,
                  # to one version in every setup-uv step. Dependabot does not
                  # bump this input, so it is bumped by hand with uv's releases.
                  version: "0.13.9"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install 3.13

            - name: Install dependencies
              run: uv sync --locked

            - name: Check formatting
              run: uv run ruff format --check .

            - name: Check linting
              run: uv run ruff check .

            - name: Check types
              run: uv run ty check

            - name: Check import layering
              run: uv run lint-imports

            # docs/schema/*.json is a committed generated artifact; fail if it
            # drifted from the pydantic models, byte for byte, or if the
            # versioned copy a version bump adds is not committed yet. --check
            # writes nothing and names each stale or missing file.
            - name: Check committed schema is current
              run: uv run python scripts/generate_schema.py --check

    test:
        name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        # Generous enough for the Windows leg, which legitimately runs ~20 min:
        # pytester spawns a subprocess (and its own HTTP server) per integration
        # test, and that is far slower on Windows than on Linux (~3 min there).
        # This is a hang guard, not a performance budget — it only needs to beat
        # GitHub's 360-minute default, so leave real headroom above the observed
        # runtime rather than trimming it close.
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.13", "3.14"]
                exclude:
                    # One Windows job (3.13) covers path semantics; the full
                    # Python matrix runs on Linux.
                    - os: windows-latest
                      python-version: "3.14"
        env:
            UV_PYTHON: ${{ matrix.python-version }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.9"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install ${{ matrix.python-version }}

            - name: Install dependencies
              run: uv sync --locked

            # `coverage run -m pytest` (not `pytest --cov`) so coverage starts before
            # pytest imports the plugin under test — otherwise every module-level line
            # of the package is imported pre-measurement and reported as a 0% floor.
            # One command per step: on windows-latest the default shell is pwsh, which
            # only propagates the LAST command's exit code from a multi-line block —
            # a failing pytest would be masked by a succeeding `coverage xml`.
            #
            # `-n auto` distributes the suite over the runner's cores. Almost all of
            # the wall time is integration tests that each spawn a pytester session
            # and its own HTTP server, and those are independent, so this roughly
            # halves the Linux legs and helps the Windows one more. It does not
            # change what is measured: `parallel = true` already writes pid-suffixed
            # data files for the pytester subprocesses, and the Combine step below
            # merges the worker files the same way.
            - name: Run tests with coverage
              run: uv run coverage run -m pytest tests -v -n auto

            # parallel + patch=subprocess produce pid-suffixed data files (one
            # per pytester subprocess); merge them before reporting.
            - name: Combine coverage
              run: uv run coverage combine

            - name: Coverage report
              run: uv run coverage report --show-missing

            - name: Coverage XML
              run: uv run coverage xml

            # Handed to the coverage job, which uploads it to Codecov; that job
            # runs under the same conditions, less the matrix leg's.
            - name: Upload coverage XML artifact
              if: >-
                  matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest' &&
                  (github.event_name == 'push' ||
                  (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-xml
                  path: coverage.xml
                  if-no-files-found: error
                  # Read by the coverage job of the same run; a week leaves room to re-run it.
                  retention-days: 7

    # Codecov's upload, in a job of its own: the OIDC token it needs is then
    # never granted to the test matrix, which runs the tests and every dev
    # dependency. It runs once every test leg has passed. Skipped for fork PRs
    # (GitHub never grants them the OIDC token, so the upload would hard-fail
    # external contributors' CI) and for the release-gate workflow_call
    # (coverage of a release run adds nothing).
    coverage:
        name: Upload coverage
        needs: test
        if: >-
            github.event_name == 'push' ||
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write # codecov OIDC upload
        steps:
            # The Codecov action requires a checkout, and maps coverage.xml's
            # paths onto the repository's files through it.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download coverage XML artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: coverage-xml

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: ./coverage.xml
                  use_oidc: true
                  fail_ci_if_error: true
                  verbose: true

    test-lowest:
        name: Test (lowest dependency floors)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.9"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install 3.13

            # Resolve every direct dependency at its declared MINIMUM version,
            # so the floors in pyproject.toml are tested claims, not guesses.
            - name: Resolve lowest direct versions
              run: uv lock --resolution lowest-direct

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run tests
              run: uv run --frozen pytest tests -v -n auto

    # Non-blocking early warning: run the suite against pytest's main branch so
    # upcoming deprecations/breakage surface before a pytest release day.
    test-prerelease:
        name: Test (pytest main, non-blocking)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.9"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install 3.13

            - name: Install dependencies
              run: uv sync --locked

            - name: Upgrade to pytest main
              run: uv pip install --upgrade "pytest @ git+https://github.com/pytest-dev/pytest"

            # --no-sync so uv run does not restore the locked pytest.
            #
            # -p no:anyio is gone: anyio 4.15.1 imports CallSpec and only falls
            # back to the renamed CallSpec2 alias on older pytest, so its
            # pytest11 entry point no longer trips `filterwarnings = error`
            # during load_setuptools_entrypoints. The flag only ever covered
            # THIS run in any case — pytester deletes PYTEST_ADDOPTS, so the
            # inner sessions most of this suite is made of never inherited it,
            # and the anyio floor in uv.lock is what actually fixes those.
            - name: Run tests
              run: uv run --no-sync pytest tests -v -n auto
