name: Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    # Allows publish.yml to run the full lint+test suite as a release gate.
    workflow_call:

permissions:
    contents: read

# Cancel superseded runs on PR updates; never cancel a push run or the
# release-gate invocation (workflow_call from publish.yml).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install 3.13

            - name: Install dependencies
              run: uv sync --locked

            - name: Check formatting
              run: uv run ruff format --check .

            - name: Check linting
              run: uv run ruff check .

            - name: Check types
              run: uvx ty@0.0.49 check

            - name: Check import layering
              run: uv run lint-imports

            # docs/schema/*.json is a committed generated artifact; fail if it
            # drifted from the pydantic models (git add -N so a brand-new
            # versioned directory after a version bump is flagged too).
            - name: Check committed schema is current
              run: |
                  uv run python scripts/generate_schema.py
                  git add -N docs/schema
                  git diff --exit-code docs/schema

    test:
        name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        # Generous enough for the Windows leg, which legitimately runs ~20 min:
        # pytester spawns a subprocess (and its own HTTP server) per integration
        # test, and that is far slower on Windows than on Linux (~3 min there).
        # This is a hang guard, not a performance budget — it only needs to beat
        # GitHub's 360-minute default, so leave real headroom above the observed
        # runtime rather than trimming it close.
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.13", "3.14"]
                exclude:
                    # One Windows job (3.13) covers path semantics; the full
                    # Python matrix runs on Linux.
                    - os: windows-latest
                      python-version: "3.14"
        env:
            UV_PYTHON: ${{ matrix.python-version }}
        permissions:
            contents: read
            id-token: write # codecov OIDC upload
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install ${{ matrix.python-version }}

            - name: Install dependencies
              run: uv sync --locked

            # `coverage run -m pytest` (not `pytest --cov`) so coverage starts before
            # pytest imports the plugin under test — otherwise every module-level line
            # of the package is imported pre-measurement and reported as a 0% floor.
            # One command per step: on windows-latest the default shell is pwsh, which
            # only propagates the LAST command's exit code from a multi-line block —
            # a failing pytest would be masked by a succeeding `coverage xml`.
            - name: Run tests with coverage
              run: uv run coverage run -m pytest tests -v

            # parallel + patch=subprocess produce pid-suffixed data files (one
            # per pytester subprocess); merge them before reporting.
            - name: Combine coverage
              run: uv run coverage combine

            - name: Coverage report
              run: uv run coverage report --show-missing

            - name: Coverage XML
              run: uv run coverage xml

            # Skipped for fork PRs (GitHub never grants them the OIDC token, so
            # the upload would hard-fail external contributors' CI) and for the
            # release-gate workflow_call (coverage of a release run adds nothing).
            - name: Upload coverage to Codecov
              if: >-
                  matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest' &&
                  (github.event_name == 'push' ||
                  (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
              uses: codecov/codecov-action@v7
              with:
                  files: ./coverage.xml
                  use_oidc: true
                  fail_ci_if_error: true
                  verbose: true

    test-lowest:
        name: Test (lowest dependency floors)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install 3.13

            # Resolve every direct dependency at its declared MINIMUM version,
            # so the floors in pyproject.toml are tested claims, not guesses.
            - name: Resolve lowest direct versions
              run: uv lock --resolution lowest-direct

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run tests
              run: uv run --frozen pytest tests -v

    # Non-blocking early warning: run the suite against pytest's main branch so
    # upcoming deprecations/breakage surface before a pytest release day.
    test-prerelease:
        name: Test (pytest main, non-blocking)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        continue-on-error: true
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python
              run: uv python install 3.13

            - name: Install dependencies
              run: uv sync --locked

            - name: Upgrade to pytest main
              run: uv pip install --upgrade "pytest @ git+https://github.com/pytest-dev/pytest"

            # --no-sync so uv run does not restore the locked pytest.
            #
            # -p no:anyio because anyio ships a pytest11 entry point that is
            # auto-loaded purely because httpx pulls anyio in transitively — the
            # suite never uses it. Its plugin imports the CallSpec2 alias, which
            # pytest main renamed, and `filterwarnings = error` promotes that
            # deprecation to a hard error during load_setuptools_entrypoints.
            # Without this flag the job dies before collecting a single test, so
            # it silently warns about nothing. Drop the flag once anyio releases
            # a build that imports CallSpec instead.
            - name: Run tests
              run: uv run --no-sync pytest tests -v -p no:anyio
