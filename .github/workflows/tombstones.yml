# One-shot (manually dispatched) publisher for the deprecated sub-package
# placeholders under tombstones/. The original pytest-httpchain-* sub-package
# projects were deleted from PyPI after the 0.9.0 consolidation, leaving the
# names claimable by anyone while pre-0.9 releases still depend on them; these
# placeholders re-register the names (Development Status :: Inactive, depending
# on pytest-httpchain>=0.9). Each name needs a PyPI "pending publisher" entry
# pointing at this repo + workflow + environment before its job can publish.
name: Publish tombstones

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # Same build/publish split as publish.yml: checkout and the build backend
    # run without the OIDC credential.
    build:
        name: Build ${{ matrix.package }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package:
                    - pytest-httpchain-core
                    - pytest-httpchain-jsonref
                    - pytest-httpchain-models
                    - pytest-httpchain-templates
                    - pytest-httpchain-userfunc
                    - pytest-httpchain-mcp
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Build
              run: uv build --project "tombstones/${{ matrix.package }}" --out-dir dist

            - name: Upload distribution artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dist-${{ matrix.package }}
                  path: dist/

    publish:
        name: Publish ${{ matrix.package }}
        runs-on: ubuntu-latest
        needs: build
        # PyPI pending publishers must be unique per (owner, repo, workflow,
        # environment), so each package needs its own environment name as the
        # distinguishing claim.
        environment: pypi-${{ matrix.package }}
        permissions:
            id-token: write # mandatory for trusted publishing
        strategy:
            fail-fast: false
            matrix:
                package:
                    - pytest-httpchain-core
                    - pytest-httpchain-jsonref
                    - pytest-httpchain-models
                    - pytest-httpchain-templates
                    - pytest-httpchain-userfunc
                    - pytest-httpchain-mcp
        steps:
            - name: Download distribution artifact
              uses: actions/download-artifact@v8
              with:
                  name: dist-${{ matrix.package }}
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist
