# Keep GitHub Actions refs, uv.lock and devcontainer features moving; grouped weekly PRs.
version: 2
updates:
    # The workflows pin each action to a full commit SHA, its release named in a
    # `# vX.Y.Z` comment; an update moves the SHA and the comment together.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      groups:
          dependencies:
              patterns: ["*"]
              # The uv_build [build-system] range has no uv.lock entry, so its bump
              # changes a requirement only. Dependabot rejects a group mixing that
              # with lock-only bumps and skipped the whole group ("Previous version
              # was not provided for: 'uv-build'"); on its own it gets a PR.
              exclude-patterns: ["uv-build"]

    - package-ecosystem: devcontainers
      directory: /
      schedule:
          interval: weekly
      groups:
          devcontainers:
              patterns: ["*"]
