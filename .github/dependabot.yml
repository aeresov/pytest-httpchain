# Keep GitHub Actions refs and uv.lock moving; grouped weekly PRs.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      # Dependabot cannot move the [build-system] uv_build range: it tries, then
      # skips the WHOLE group ("Previous version was not provided for:
      # 'uv-build'"), so no lock update is ever proposed. Bump that range by hand.
      ignore:
          - dependency-name: "uv-build"
      groups:
          dependencies:
              patterns: ["*"]
