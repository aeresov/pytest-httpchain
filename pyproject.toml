[project]
name = "pytest-httpchain"
version = "0.21.1"
description = "pytest plugin for HTTP testing using JSON files"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Alexander Eresov", email = "aeresov@gmail.com" }]
dependencies = [
    # attrs.fields, for the validator classes a body schema is validated with
    # (body_schema): the floor jsonschema 4.18.0 itself requires.
    "attrs>=22.2.0",
    "deepmerge>=2.0",
    # 3.2.10 is the first release that parses a description on an operation,
    # a fragment or a variable, as every final release after it does: below
    # it, a query holding one loads or not by the version installed. (The
    # 3.3.0 pre-releases before 3.3.0a13, which `>=` admits once pre-releases
    # are allowed, do not.) Not 3.3: graphene, graphql-relay and sgqlc require
    # a graphql-core below it.
    "graphql-core>=3.2.10",
    # 0.28.0 is the first release that takes a socks5h:// proxy, which
    # client.proxy accepts. (0.27.0 also percent-encoded a `\` in a URL path,
    # `/a%5Cb`, so a URL the plugin sends as written did not reach the server
    # as written.) No upper bound, but before taking a new httpx: the built-in
    # digest auth (request_builder._DigestAuth) builds on DigestAuth's private
    # state, which its unit tests in tests/unit/test_request_builder.py pin.
    "httpx[http2]>=0.28.0",
    # The parser pytest reads its ini files with: `validate` reads
    # httpchain_suffix from one (validation.discovery) as pytest would. The
    # floor pytest 9.0 itself requires.
    "iniconfig>=1.0.1",
    # 1.0.1 is the first release whose expression cache works on Python 3.11
    # and later. 1.0.0 picks what to evict with random.sample over the cache's
    # keys, which a dict's are no sequence for: the 129th distinct expression
    # one process compiles raises TypeError.
    "jmespath>=1.0.1",
    "jsonschema>=4.18.0",
    # The meta-schemas a body schema's registry holds (body_schema): the
    # floor jsonschema 4.18.0 itself requires, as for attrs.
    "jsonschema-specifications>=2023.03.6",
    # 1.2.0 supplies Python 3.14 wheels, which the project supports.
    "msgpack>=1.2.0",
    "pydantic>=2.13.4",
    "referencing>=0.28.4",
    "pyrate-limiter>=4.2.0",
    "pytest>=9.0",
    # 1.0.8 blocks sandbox escapes through the operator module and os.exec*/spawn*.
    "simpleeval>=1.0.8",
    # 0.26.0 is the first release that stopped importing the deprecated
    # `click.utils.get_binary_stream`; with `filterwarnings = error` any older
    # typer fails collection against current click.
    "typer>=0.26.0",
]
keywords = ["testing", "pytest", "httpx", "http", "api", "integration-testing"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/aeresov/pytest-httpchain"
Documentation = "https://aeresov.github.io/pytest-httpchain/"
Changelog = "https://github.com/aeresov/pytest-httpchain/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "flask>=3.0",
    "flask-httpauth>=4.8.0",
    "import-linter>=2.0",
    "ruff>=0.12.1",
    # 0.0.100 renamed the rules that [tool.ty.overrides.rules] and the
    # `ty: ignore[...]` comments in src/ name: unresolved-attribute became
    # missing-attribute (its union case split out as missing-union-attribute)
    # and invalid-{method,attribute}-override became incompatible-...-override.
    # An older ty does not know the new names, so `ty check` fails on it.
    "ty>=0.0.100",
    "coverage[toml]>=7.10", # `patch = ["subprocess"]` needs 7.10

    "pytest-datadir>=1.7.2",
    # Not a runtime dependency: the plugin's own collection hooks own stage
    # ordering. Installed in dev so the ordering regression tests can exercise
    # the regroup's defense against a user-installed pytest-order.
    "pytest-order>=1.3.0",
    "pytest-xdist>=3.8.0",
    # httpx's SOCKS support (its `socks` extra), which users install
    # themselves: the tests build a client for every client.proxy scheme.
    "socksio>=1.0.0",
    "trustme>=1.1.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.16",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["src/pytest_httpchain/**/CLAUDE.md"]

[project.scripts]
pytest-httpchain = "pytest_httpchain.cli:app"

[project.entry-points.pytest11]
pytest_httpchain = "pytest_httpchain.plugin"

[tool.ruff]
line-length = 180
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "PT", # flake8-pytest-style
    "TID252", # flake8-tidy-imports: ban relative imports
    "RUF100", # a `noqa` that suppresses nothing, or names no enabled rule
    "PGH", # pygrep-hooks: blanket `noqa` and `type: ignore`, misused mock assertions
    "PLE", # pylint errors
    "EXE", # a shebang and the file's executable bit agree
    "PIE", # flake8-pie: unnecessary code
    "FURB", # refurb: older idioms with a modern spelling
]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# Off by default. A bare `ty: ignore` silences every rule on its line; src/ and
# tests/ name the rule they expect instead (`ty: ignore[...]`), and this keeps it so.
blanket-ignore-comment = "error"
# Off by default. A method that overrides a base class's says so with
# `@typing.override`, and invalid-explicit-override (an error by default) fails a
# decorated method that overrides nothing: one overriding a private hook that a
# dependency then renames (pytest's `Module._getobj`, simpleeval's
# `_eval_subscript`) fails `ty check` instead of going uncalled. Everywhere but
# tests/ (src/, scripts/, tombstones/): the tests/ override below turns it off.
missing-override-decorator = "error"

# Test code uses values wider than the checker can narrow, and feeds models input
# they must refuse: Optional and union results used without a narrowing check
# (`Response | None`, `Match | None`), dicts unpacked with `**` into typed calls,
# test doubles given attributes on the fly, and models built with invalid types
# to assert ValidationError. The hits spread across about two dozen test files,
# the models package's a minority of them. Relax those specific rules
# for test code only; src/ stays strict and uses pinpoint `# ty: ignore[...]`
# comments instead.
# unknown-argument and missing-argument fire nowhere today: they are kept for a
# model built directly with an unknown or a missing field, to assert the same.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unknown-argument = "ignore"
missing-attribute = "ignore"
missing-union-attribute = "ignore"
not-subscriptable = "ignore"
missing-argument = "ignore"
# On everywhere else in [tool.ty.rules], not here: test code subclasses freely for its
# doubles (about 30 overriding methods in a dozen files: fake adapters and
# transports, objects with a `__str__` or `__repr__` of their own).
missing-override-decorator = "ignore"

[tool.pytest]
minversion = "9.0"
# pytest 9 umbrella: strict_config, strict_markers, strict_xfail,
# strict_parametrization_ids — unknown ini keys and unregistered markers
# become errors instead of warnings.
strict = true
# Logs are captured and shown only for failing tests (pytest's default). Streaming
# live INFO for every passing test buried real output ~10-27x; opt back in per-run
# with `-o log_cli=true --log-cli-level=INFO` when debugging.
log_cli = false
log_cli_level = "INFO"
norecursedirs = ["examples"]
pytester_example_dir = "tests/integration/examples"
addopts = ["--log-disable=werkzeug", "--import-mode=importlib"]
pythonpath = [
    ".",
]
testpaths = ["tests"]
markers = [
    "slow: subprocess-spawning or sleep-bound integration test; deselect with -m 'not slow'",
]
# Treat warnings as errors so dependency deprecations (e.g. across the 3.13/3.14
# and lowest-floor matrix) fail loudly instead of rotting. The plugin's own
# ScenarioValidationWarning is intentional behavior that many tests assert on,
# so it stays a warning; individual tests still escalate it via -W when needed.
filterwarnings = [
    "error",
    "default::pytest_httpchain.ScenarioValidationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
# Measure pytester subprocess children too (runpytest_subprocess families):
# `patch` injects startup into every child with this config serialized —
# data_file/source absolutized, so children report into this project's data
# files regardless of their CWD. Requires the pid-suffixed parallel data
# files; run `coverage combine` before `coverage report`.
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# Regression floor for the CI `coverage report` step (full suite under
# `coverage run -m pytest`, ~98%). Kept a few points below the real number to
# tolerate platform/Python-version branch differences; ratchet upward as
# coverage improves rather than letting it silently erode.
fail_under = 96

[tool.importlinter]
root_package = "pytest_httpchain"

# Exhaustive vertical layering: every top-level module must appear in exactly one
# layer; a new module fails lint-imports until it is placed. Modules on the same
# layer (separated by "|") are additionally kept mutually independent: neither
# may import the other, which ":" would allow.
[[tool.importlinter.contracts]]
name = "package layering"
type = "layers"
containers = ["pytest_httpchain"]
exhaustive = true
layers = [
    "plugin | cli",
    "factory",
    # importers is the cli's `import` command, beside carrier and independent
    # of it: it builds on validation, templates and redaction, and nothing on
    # a lower layer, the domain packages included, may import it.
    "carrier | dataflow | schema | importers",
    # rendering is the carrier's guard over what a template renders into a
    # declared model; it builds on response_steps' render types, and only
    # the carrier uses it.
    "rendering",
    "validation | har_writer | report_formatter | request_builder | response_steps | parallel_stats | stage_settings",
    # connections is the connection stages' sessions and readers, below
    # response_steps, which judges a message: the carrier injects the match.
    "connections",
    "body_schema",
    # scoping reads stage marks with utils.parse_marker (scoping.SkipCause).
    "scoping",
    "utils | redaction",
    "userfunc",
    "models",
    "templates | jsonref",
    "wire_codec",
    "errors | constants | warnings",
]

# Horizontal refinement the layers contract cannot express: models sits above
# templates and jsonref and may import templates, but must never import jsonref.
# (userfunc sits above models: it imports models, never the other way round.)
[[tool.importlinter.contracts]]
name = "models does not import jsonref"
type = "forbidden"
source_modules = ["pytest_httpchain.models"]
forbidden_modules = ["pytest_httpchain.jsonref"]
